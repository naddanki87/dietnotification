name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DietNotify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DietNotify-apk
          path: DietNotify.apk

      - name: Publish downloadable APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" DietNotify.apk \
            --target "$GITHUB_SHA" \
            --title "DietNotify APK ($GITHUB_REF_NAME)" \
            --notes "Latest DietNotify build from \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA). Download **DietNotify.apk** below and open it on your Android phone (allow installing from unknown sources)."
