name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DietNotify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DietNotify-apk
          path: DietNotify.apk

      - name: Publish downloadable APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" DietNotify.apk \
            --target "$GITHUB_SHA" \
            --title "DietNotify APK ($GITHUB_REF_NAME)" \
            --notes "Latest DietNotify build from \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA). Download **DietNotify.apk** below and open it on your Android phone (allow installing from unknown sources)."

  device-test:
    # Runs the real upload -> OCR -> alarm scheduling flow on an Android emulator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest; status=$?; adb logcat -d -s DietNotifyTest:I; exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/connected/
